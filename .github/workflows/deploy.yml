name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, codex/ai-image-mvp]
  workflow_run:
    workflows: ["Sync Skills Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SITE_URL: https://image-chi-kohl.vercel.app
        run: |
          npx tsc -b
          npx vite build
          node scripts/generate-skill-pages.mjs
          node scripts/generate-scenario-pages.mjs
          node scripts/generate-comparison-pages.mjs
          node scripts/generate-badges.mjs
          node scripts/generate-rss.mjs
          node scripts/generate-sitemap.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
