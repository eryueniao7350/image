name: aihot-sync

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
      FEISHU_AIHOT_TABLE_ID: ${{ vars.FEISHU_AIHOT_TABLE_ID }}
      FEISHU_DAILY_POOL_TABLE_ID: ${{ vars.FEISHU_DAILY_POOL_TABLE_ID }}
      FEISHU_TASKS_TABLE_ID: ${{ vars.FEISHU_TASKS_TABLE_ID }}
      FEISHU_AIHOT_TASK_RECORD_ID: ${{ vars.FEISHU_AIHOT_TASK_RECORD_ID }}
      FEISHU_AIHOT_TASK_NAME: ${{ vars.FEISHU_AIHOT_TASK_NAME }}
      FEISHU_TASK_NAME_FIELDS: ${{ vars.FEISHU_TASK_NAME_FIELDS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required secrets
        run: |
          test -n "$FEISHU_APP_ID"
          test -n "$FEISHU_APP_SECRET"
          test -n "$FEISHU_BASE_TOKEN"

      - name: Run AIHOT sync
        run: python3 ops/aihot_sync.py --hours 4 --log-dir ops/logs

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aihot-sync-logs
          path: ops/logs
          if-no-files-found: ignore
